<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#182744" />
      <stop offset="60%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#080b14" />
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="apexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="hexBorderGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for Glow effects -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background Shield / Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#hexBorderGrad)" stroke-width="3" opacity="0.65" />

  <!-- Background Tech Grid Lines (Subtle) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.2">
    <circle cx="256" cy="256" r="190" fill="none" stroke-dasharray="4,8" />
    <circle cx="256" cy="256" r="120" fill="none" stroke-dasharray="6,6" />
    <line x1="256" y1="40" x2="256" y2="472" stroke-dasharray="4,6" />
    <line x1="40" y1="256" x2="472" y2="256" stroke-dasharray="4,6" />
  </g>

  <!-- Connection Links (Hierarchical Tree Lines) -->
  <g stroke-linecap="round" filter="url(#softGlow)">
    <!-- Apex (Top Tier) to Mid-Left -->
    <line x1="256" y1="120" x2="168" y2="242" stroke="url(#purpleGrad)" stroke-width="4.5" opacity="0.85" />
    <!-- Apex to Mid-Right -->
    <line x1="256" y1="120" x2="344" y2="242" stroke="url(#cyanGrad)" stroke-width="4.5" opacity="0.85" />
    <!-- Mid-tier horizontal connection -->
    <line x1="168" y1="242" x2="344" y2="242" stroke="#3b82f6" stroke-width="2.5" opacity="0.4" stroke-dasharray="5,5" />
    <!-- Mid-Left to Base Left -->
    <line x1="168" y1="242" x2="114" y2="368" stroke="url(#amberGrad)" stroke-width="4" opacity="0.85" />
    <!-- Mid-Left to Base Center -->
    <line x1="168" y1="242" x2="256" y2="368" stroke="url(#greenGrad)" stroke-width="4" opacity="0.85" />
    <!-- Mid-Right to Base Center -->
    <line x1="344" y1="242" x2="256" y2="368" stroke="url(#greenGrad)" stroke-width="4" opacity="0.85" />
    <!-- Mid-Right to Base Right -->
    <line x1="344" y1="242" x2="398" y2="368" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.85" />
  </g>

  <!-- Power Tier Level Indicator Rays / Rings -->
  <g opacity="0.25">
    <path d="M 90,380 L 422,380" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 140,254 L 372,254" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 210,128 L 302,128" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  </g>

  <!-- Nodes (Tier Tree Elements) -->
  <!-- Level 3: Base Nodes -->
  <!-- Base Left (Rank C / Entry) -->
  <g transform="translate(114, 368)">
    <circle r="26" fill="#141c2e" stroke="url(#amberGrad)" stroke-width="3.5" filter="url(#softGlow)" />
    <circle r="12" fill="url(#amberGrad)" opacity="0.8" />
  </g>

  <!-- Base Center (Rank B / Core) -->
  <g transform="translate(256, 368)">
    <circle r="28" fill="#141c2e" stroke="url(#greenGrad)" stroke-width="3.5" filter="url(#softGlow)" />
    <circle r="14" fill="url(#greenGrad)" opacity="0.9" />
  </g>

  <!-- Base Right (Rank B+ / Synergy) -->
  <g transform="translate(398, 368)">
    <circle r="26" fill="#141c2e" stroke="url(#cyanGrad)" stroke-width="3.5" filter="url(#softGlow)" />
    <circle r="12" fill="url(#cyanGrad)" opacity="0.8" />
  </g>

  <!-- Level 2: Intermediate High Nodes (Rank A) -->
  <g transform="translate(168, 242)">
    <rect x="-26" y="-26" width="52" height="52" rx="16" transform="rotate(45)" fill="#151d33" stroke="url(#purpleGrad)" stroke-width="3.8" filter="url(#softGlow)" />
    <circle r="13" fill="url(#purpleGrad)" opacity="0.9" />
  </g>

  <g transform="translate(344, 242)">
    <rect x="-26" y="-26" width="52" height="52" rx="16" transform="rotate(45)" fill="#151d33" stroke="url(#cyanGrad)" stroke-width="3.8" filter="url(#softGlow)" />
    <circle r="13" fill="url(#cyanGrad)" opacity="0.9" />
  </g>

  <!-- Level 1: Apex Sovereign Node (Rank S / Top Tier) -->
  <g transform="translate(256, 116)" filter="url(#glowEffect)">
    <!-- Outer energy crown diamond -->
    <path d="M 0,-44 L 40,0 L 0,44 L -40,0 Z" fill="#10172a" stroke="url(#apexGrad)" stroke-width="4.5" />
    <polygon points="0,-24 22,0 0,24 -22,0" fill="url(#apexGrad)" />
    <!-- Crown / Peak Star -->
    <circle cx="0" cy="0" r="7" fill="#ffffff" />
  </g>

  <!-- ARPO Monogram Symbol Badge at bottom center -->
  <g transform="translate(256, 442)">
    <rect x="-70" y="-18" width="140" height="26" rx="13" fill="#111827" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
    <text x="0" y="0" fill="#e2e8f0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="4" text-anchor="middle" dominant-baseline="central">A · R · P · O</text>
  </g>
</svg>
